<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DIX + Dual-SMA Signal — Backtest</title>
  <style>
    :root {
      color-scheme: light;
      --plane:        #f9f9f7;
      --surface:      #fcfcfb;
      --border:       rgba(11,11,11,0.10);
      --text-1:       #0b0b0b;
      --text-2:       #52514e;
      --muted:        #898781;
      --grid:         #e1e0d9;
      --axis:         #c3c2b7;
      --series-port:  #2a78d6;
      --series-bench: #898781;
      --good:         #006300;
      --bad:          #d03b3b;
      --tile-accent:  #2a78d6;
    }
    @media (prefers-color-scheme: dark) {
      :root:where(:not([data-theme="light"])) {
        color-scheme: dark;
        --plane:        #0d0d0d;
        --surface:      #1a1a19;
        --border:       rgba(255,255,255,0.10);
        --text-1:       #ffffff;
        --text-2:       #c3c2b7;
        --muted:        #898781;
        --grid:         #2c2c2a;
        --axis:         #383835;
        --series-port:  #3987e5;
        --series-bench: #898781;
        --good:         #0ca30c;
        --bad:          #e34948;
        --tile-accent:  #3987e5;
      }
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --plane:#0d0d0d; --surface:#1a1a19; --border:rgba(255,255,255,0.10);
      --text-1:#ffffff; --text-2:#c3c2b7; --muted:#898781; --grid:#2c2c2a;
      --axis:#383835; --series-port:#3987e5; --series-bench:#898781;
      --good:#0ca30c; --bad:#e34948; --tile-accent:#3987e5;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--plane);
      color: var(--text-1);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }
    header {
      display: flex; align-items: baseline; justify-content: space-between;
      flex-wrap: wrap; gap: 12px; margin-bottom: 6px;
    }
    header h1 { font-size: 1.35rem; font-weight: 600; letter-spacing: 0.01em; }
    .params { font-size: 0.8rem; color: var(--text-2); }
    .controls { display: flex; align-items: center; gap: 10px; }
    button, label.filebtn {
      background: var(--surface); color: var(--text-1);
      border: 1px solid var(--border); border-radius: 7px;
      padding: 7px 14px; font-size: 0.8rem; cursor: pointer; font-family: inherit;
    }
    button:hover, label.filebtn:hover { border-color: var(--tile-accent); }
    #theme-toggle { padding: 7px 10px; }

    .banner {
      margin: 10px 0 18px; padding: 8px 14px; border-radius: 7px;
      background: color-mix(in srgb, var(--tile-accent) 12%, var(--surface));
      border: 1px solid var(--border); font-size: 0.8rem; color: var(--text-2);
    }
    .banner.hidden { display: none; }

    .tiles {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 12px; margin-bottom: 20px;
    }
    .tile {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 10px; padding: 14px 16px;
    }
    .tile .k { font-size: 0.72rem; color: var(--muted); letter-spacing: 0.02em;
               text-transform: uppercase; margin-bottom: 6px; }
    .tile .v { font-size: 1.5rem; font-weight: 600; line-height: 1.1; }
    .tile .s { font-size: 0.72rem; color: var(--text-2); margin-top: 4px; }
    .pos { color: var(--good); } .neg { color: var(--bad); }

    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 18px 18px 10px; margin-bottom: 20px;
    }
    .card h2 { font-size: 0.9rem; font-weight: 600; margin-bottom: 4px; }
    .card .sub { font-size: 0.76rem; color: var(--text-2); margin-bottom: 10px; }
    .legend { display: flex; gap: 18px; margin: 2px 0 8px; font-size: 0.78rem; color: var(--text-2); }
    .legend .item { display: flex; align-items: center; gap: 7px; }
    .legend .sw { width: 22px; height: 0; border-top-width: 3px; border-top-style: solid; border-radius: 2px; }

    .chart-wrap { position: relative; width: 100%; overflow-x: auto; }
    svg { width: 100%; height: auto; display: block; touch-action: none; }
    .tick text { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
    .grid-line { stroke: var(--grid); stroke-width: 1; }
    .axis-line { stroke: var(--axis); stroke-width: 1; }
    .endlabel { font-size: 11px; font-weight: 600; }

    #tooltip {
      position: absolute; pointer-events: none; opacity: 0; transition: opacity .08s;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; padding: 8px 10px; font-size: 0.75rem;
      box-shadow: 0 4px 18px rgba(0,0,0,0.18); min-width: 150px; z-index: 5;
    }
    #tooltip .tt-date { color: var(--muted); margin-bottom: 5px; }
    #tooltip .tt-row { display: flex; justify-content: space-between; gap: 14px;
                       font-variant-numeric: tabular-nums; }
    #tooltip .tt-row .name { display: flex; align-items: center; gap: 6px; }
    #tooltip .dot { width: 9px; height: 9px; border-radius: 50%; }

    .table-wrap { overflow-x: auto; }
    table { border-collapse: collapse; width: 100%; font-size: 0.8rem; }
    th, td { padding: 8px 12px; text-align: right; white-space: nowrap;
             border-bottom: 1px solid var(--border); font-variant-numeric: tabular-nums; }
    th:first-child, td:first-child { text-align: left; font-variant-numeric: normal; }
    th { color: var(--muted); font-weight: 600; font-size: 0.72rem; text-transform: uppercase;
         cursor: pointer; user-select: none; position: sticky; top: 0; background: var(--surface); }
    th:hover { color: var(--text-1); }
    th.sorted::after { content: " ▾"; }
    th.sorted.asc::after { content: " ▴"; }
    tbody tr:hover { background: color-mix(in srgb, var(--tile-accent) 8%, var(--surface)); }
    td.tk { font-weight: 600; }
    .empty { padding: 40px; text-align: center; color: var(--text-2); }
  </style>
</head>
<body>

<header>
  <div>
    <h1>DIX + Dual-SMA Signal — Backtest</h1>
    <div class="params" id="params"></div>
  </div>
  <div class="controls">
    <label class="filebtn">Load results…<input id="file" type="file" accept=".json" hidden></label>
    <button id="theme-toggle" title="Toggle theme">◐</button>
  </div>
</header>

<div class="banner" id="banner"></div>

<div id="content">
  <div class="tiles" id="tiles"></div>

  <div class="card">
    <h2>Equity curve</h2>
    <div class="sub">Growth of $1, equal-weight pooled portfolio vs SPY buy &amp; hold — hourly bars.</div>
    <div class="legend" id="legend"></div>
    <div class="chart-wrap">
      <svg id="chart" viewBox="0 0 1000 430" preserveAspectRatio="xMidYMid meet"
           role="img" aria-label="Equity curve: portfolio vs SPY"></svg>
      <div id="tooltip"></div>
    </div>
  </div>

  <div class="card">
    <h2>Per-name performance</h2>
    <div class="sub">Click a column to sort. Return colored by sign.</div>
    <div class="table-wrap"><table id="ptable"></table></div>
  </div>
</div>

<script>
const NUMS = {
  total_return: {label:"Return", pct:true, color:true},
  cagr:         {label:"CAGR", pct:true},
  sharpe:       {label:"Sharpe", dp:2},
  max_drawdown: {label:"Max DD", pct:true, neg:true},
  n_trades:     {label:"Trades", int:true},
  hit_rate:     {label:"Hit", pct:true},
  exposure:     {label:"Exposure", pct:true},
};
const PORT = getVar("--series-port"), BENCH = getVar("--series-bench");
function getVar(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function fmtPct(x){ return x==null? "—" : (x*100).toFixed(2)+"%"; }
function fmtNum(x,dp){ return x==null? "—" : Number(x).toFixed(dp); }

let DATA = null, sortKey = "total_return", sortAsc = false;

// ---- theme toggle ----
document.getElementById("theme-toggle").onclick = () => {
  const cur = document.documentElement.getAttribute("data-theme");
  const next = cur === "dark" ? "light" : cur === "light" ? "dark"
    : (matchMedia("(prefers-color-scheme: dark)").matches ? "light" : "dark");
  document.documentElement.setAttribute("data-theme", next);
  if (DATA) render();  // recolor with new CSS vars
};

// ---- data loading ----
document.getElementById("file").onchange = (e) => {
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = () => { try { load(JSON.parse(r.result), f.name); } catch(err){ showEmpty("Could not parse "+f.name); } };
  r.readAsText(f);
};

function load(payload, sourceName){
  if(!payload || payload.empty){ showEmpty("This results file is empty."); return; }
  DATA = payload;
  const b = document.getElementById("banner");
  const synthetic = sourceName && /sample/i.test(sourceName);
  if(synthetic){
    b.classList.remove("hidden");
    b.innerHTML = "⚠️ <strong>Synthetic sample data</strong> — a plumbing/preview check only, "
      + "not a market result. Run <code>python -m dixsignal.cli run --years 2 --json results.json</code> "
      + "where FINRA + Yahoo are reachable, then <em>Load results…</em>.";
  } else { b.classList.add("hidden"); }
  render();
}

function showEmpty(msg){
  document.getElementById("content").innerHTML = '<div class="empty">'+msg+'</div>';
}

function render(){
  renderParams(); renderTiles(); renderLegend(); renderChart(); renderTable();
}

function renderParams(){
  const p = DATA.params || {};
  if(!Object.keys(p).length){ document.getElementById("params").textContent=""; return; }
  const gate = p.require_gate ? `top-${Math.round((1-p.decile_q)*100)}% DIX (${p.decile_mode})` : "GATE OFF (SMA-only)";
  document.getElementById("params").textContent =
    `${p.sma_hourly}h SMA × ${p.sma_daily}d SMA × ${gate}`;
}

function renderTiles(){
  const p = DATA.portfolio;
  const bench = p.benchmark_total_return;
  const excess = (bench!=null) ? p.total_return - bench : null;
  const tiles = [
    {k:"Portfolio Return", v:fmtPct(p.total_return), cls: signClass(p.total_return),
     s: bench!=null ? `SPY ${fmtPct(bench)}` : ""},
    {k:"vs SPY (excess)", v: excess!=null? fmtPct(excess):"—", cls: signClass(excess), s:"portfolio − benchmark"},
    {k:"CAGR", v:fmtPct(p.cagr), cls: signClass(p.cagr)},
    {k:"Sharpe (hourly)", v:fmtNum(p.sharpe,2)},
    {k:"Max Drawdown", v:fmtPct(p.max_drawdown), cls:"neg"},
    {k:"Avg Hit-rate", v:fmtPct(p.avg_hit_rate)},
    {k:"Avg Exposure", v:fmtPct(p.avg_exposure)},
    {k:"Names / Trades", v:`${p.n_names}`, s:`${p.total_trades} trades`},
  ];
  document.getElementById("tiles").innerHTML = tiles.map(t =>
    `<div class="tile"><div class="k">${t.k}</div>`
    + `<div class="v ${t.cls||""}">${t.v}</div>`
    + (t.s? `<div class="s">${t.s}</div>`:"")+`</div>`).join("");
}
function signClass(x){ return x==null? "" : x>=0? "pos":"neg"; }

function renderLegend(){
  const items = [["Portfolio", PORT, false], ["SPY buy & hold", BENCH, true]];
  document.getElementById("legend").innerHTML = items.map(([n,c,dash]) =>
    `<span class="item"><span class="sw" style="border-top-color:${c};${dash?'border-top-style:dashed;':''}"></span>${n}</span>`
  ).join("");
}

// ---- SVG line chart with crosshair ----
const VB_W=1000, VB_H=430, M={t:16,r:64,b:28,l:52};
function renderChart(){
  const svg = document.getElementById("chart");
  const dates = DATA.dates, port = DATA.curves.portfolio, bench = DATA.curves.SPY || null;
  const n = port.length;
  const plotW = VB_W - M.l - M.r, plotH = VB_H - M.t - M.b;
  let lo=Infinity, hi=-Infinity;
  for(const s of [port, bench].filter(Boolean)) for(const v of s){ if(v<lo)lo=v; if(v>hi)hi=v; }
  const pad=(hi-lo)*0.06||0.1; lo-=pad; hi+=pad;
  const X = i => M.l + (n<=1?0:i/(n-1))*plotW;
  const Y = v => M.t + (1-(v-lo)/(hi-lo))*plotH;
  const path = s => s.map((v,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)).join(' ');

  // y grid ticks (5)
  let g="";
  const yticks=5;
  for(let k=0;k<=yticks;k++){
    const val=lo+(hi-lo)*k/yticks, y=Y(val);
    g+=`<line class="grid-line" x1="${M.l}" y1="${y.toFixed(1)}" x2="${M.l+plotW}" y2="${y.toFixed(1)}"/>`;
    g+=`<g class="tick"><text x="${M.l-8}" y="${(y+4).toFixed(1)}" text-anchor="end">${val.toFixed(2)}×</text></g>`;
  }
  // x date ticks (~6)
  const xt=6;
  for(let k=0;k<=xt;k++){
    const i=Math.round((n-1)*k/xt), x=X(i);
    const d=(dates[i]||"").slice(0,10);
    g+=`<g class="tick"><text x="${x.toFixed(1)}" y="${VB_H-10}" text-anchor="middle">${d}</text></g>`;
  }
  g+=`<line class="axis-line" x1="${M.l}" y1="${M.t+plotH}" x2="${M.l+plotW}" y2="${M.t+plotH}"/>`;

  // baseline at 1.0 (break-even) if in range
  let base="";
  if(lo<=1 && hi>=1){ const y1=Y(1); base=`<line x1="${M.l}" y1="${y1.toFixed(1)}" x2="${M.l+plotW}" y2="${y1.toFixed(1)}" stroke="${getVar('--axis')}" stroke-dasharray="2 3" stroke-width="1"/>`; }

  let lines="";
  if(bench) lines+=`<path d="${path(bench)}" fill="none" stroke="${BENCH}" stroke-width="2" stroke-dasharray="6 4" stroke-linejoin="round"/>`;
  lines+=`<path d="${path(port)}" fill="none" stroke="${PORT}" stroke-width="2" stroke-linejoin="round"/>`;

  // end labels
  let ends=`<text class="endlabel" x="${M.l+plotW+6}" y="${(Y(port[n-1])+4).toFixed(1)}" fill="${PORT}">${port[n-1].toFixed(2)}×</text>`;
  if(bench) ends+=`<text class="endlabel" x="${M.l+plotW+6}" y="${(Y(bench[n-1])+4).toFixed(1)}" fill="${BENCH}">${bench[n-1].toFixed(2)}×</text>`;

  const cross=`<g id="cross" style="opacity:0"><line id="cx" y1="${M.t}" y2="${M.t+plotH}" stroke="${getVar('--muted')}" stroke-width="1"/>`
    +`<circle id="cpt-p" r="4.5" fill="${PORT}" stroke="${getVar('--surface')}" stroke-width="2"/>`
    +(bench?`<circle id="cpt-b" r="4.5" fill="${BENCH}" stroke="${getVar('--surface')}" stroke-width="2"/>`:"")+`</g>`;

  svg.innerHTML = g+base+lines+ends+cross
    +`<rect id="hit" x="${M.l}" y="${M.t}" width="${plotW}" height="${plotH}" fill="transparent"/>`;

  wireCrosshair(svg, {n, X, Y, port, bench, dates, plotW, plotH});
}

function wireCrosshair(svg, ctx){
  const {n, X, Y, port, bench, dates} = ctx;
  const cross=svg.querySelector("#cross"), cx=svg.querySelector("#cx");
  const cpP=svg.querySelector("#cpt-p"), cpB=svg.querySelector("#cpt-b");
  const tip=document.getElementById("tooltip");
  const hit=svg.querySelector("#hit");
  function toIndex(clientX){
    const r=svg.getBoundingClientRect();
    const px=(clientX-r.left)/r.width*VB_W;   // viewBox x
    const frac=(px-M.l)/(VB_W-M.l-M.r);
    return Math.max(0, Math.min(n-1, Math.round(frac*(n-1))));
  }
  function move(ev){
    const clientX = ev.touches? ev.touches[0].clientX : ev.clientX;
    const i=toIndex(clientX);
    const x=X(i);
    cross.style.opacity=1; cx.setAttribute("x1",x); cx.setAttribute("x2",x);
    cpP.setAttribute("cx",x); cpP.setAttribute("cy",Y(port[i]));
    if(bench && cpB){ cpB.setAttribute("cx",x); cpB.setAttribute("cy",Y(bench[i])); }
    const r=svg.getBoundingClientRect();
    const scale=r.width/VB_W;
    let left=r.left+window.scrollX + x*scale + 12;
    const wrapLeft = svg.parentElement.getBoundingClientRect().left+window.scrollX;
    left = left - wrapLeft;
    tip.style.left=left+"px";
    tip.style.top=(8)+"px";
    tip.style.opacity=1;
    let rows=`<div class="tt-date">${(dates[i]||"")}</div>`
      +`<div class="tt-row"><span class="name"><span class="dot" style="background:${PORT}"></span>Portfolio</span><span>${port[i].toFixed(3)}×</span></div>`;
    if(bench) rows+=`<div class="tt-row"><span class="name"><span class="dot" style="background:${BENCH}"></span>SPY</span><span>${bench[i].toFixed(3)}×</span></div>`;
    tip.innerHTML=rows;
  }
  function leave(){ cross.style.opacity=0; tip.style.opacity=0; }
  hit.addEventListener("mousemove", move);
  hit.addEventListener("mouseleave", leave);
  hit.addEventListener("touchstart", move, {passive:true});
  hit.addEventListener("touchmove", move, {passive:true});
  hit.addEventListener("touchend", leave);
}

// ---- per-name table ----
function renderTable(){
  const t=document.getElementById("ptable");
  const keys=Object.keys(NUMS);
  const head=`<thead><tr><th data-k="ticker" class="${sortKey==='ticker'?'sorted '+(sortAsc?'asc':''):''}">Ticker</th>`
    + keys.map(k=>`<th data-k="${k}" class="${sortKey===k?'sorted '+(sortAsc?'asc':''):''}">${NUMS[k].label}</th>`).join("")+`</tr></thead>`;
  const rows=[...DATA.per_name].sort((a,b)=>{
    let va=a[sortKey], vb=b[sortKey];
    if(sortKey==='ticker'){ return sortAsc? String(va).localeCompare(vb):String(vb).localeCompare(va); }
    va=va==null?-Infinity:va; vb=vb==null?-Infinity:vb;
    return sortAsc? va-vb : vb-va;
  });
  const body="<tbody>"+rows.map(r=>{
    let tds=`<td class="tk">${r.ticker}</td>`;
    for(const k of keys){
      const spec=NUMS[k]; let v=r[k], txt, cls="";
      if(spec.int) txt = v==null?"—":Math.round(v);
      else if(spec.pct) txt=fmtPct(v);
      else txt=fmtNum(v, spec.dp||2);
      if(spec.color) cls=signClass(v);
      else if(spec.neg) cls="neg";
      tds+=`<td class="${cls}">${txt}</td>`;
    }
    return `<tr>${tds}</tr>`;
  }).join("")+"</tbody>";
  t.innerHTML=head+body;
  t.querySelectorAll("th").forEach(th=>th.onclick=()=>{
    const k=th.dataset.k;
    if(sortKey===k) sortAsc=!sortAsc; else { sortKey=k; sortAsc=false; }
    renderTable();
  });
}

// ---- boot: try to fetch the bundled sample; fall back to a prompt ----
fetch("dixsignal/sample_results.json").then(r=>{ if(!r.ok) throw 0; return r.json(); })
  .then(d=>load(d, "sample_results.json"))
  .catch(()=>{
    document.getElementById("banner").classList.remove("hidden");
    document.getElementById("banner").innerHTML =
      "No results file loaded. Generate one with "
      + "<code>python -m dixsignal.cli run --years 2 --json results.json</code> "
      + "(or <code>demo --json</code> for a preview) and use <em>Load results…</em>.";
  });
</script>
</body>
</html>
